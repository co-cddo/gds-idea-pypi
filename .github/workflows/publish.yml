name: Rebuild PyPI Index

on:
  push:
    branches: [main]
    paths:
      - config.toml
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}
  repository_dispatch:
    types: [rebuild-index]

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # GitHub disables scheduled workflows in public repos after 60 days without
  # repository activity. Committing a date stamp to an orphan branch (at most
  # weekly) keeps the repo active without touching the protected main branch.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Refresh keepalive branch
        run: |
          if git ls-remote --exit-code --heads origin keepalive > /dev/null; then
            git fetch --depth=1 origin keepalive:keepalive
            git checkout keepalive
            last=$(git log -1 --format=%ct)
            if [ $(( $(date +%s) - last )) -lt $(( 7 * 24 * 60 * 60 )) ]; then
              echo "keepalive branch updated within the last 7 days; nothing to do"
              exit 0
            fi
          else
            git checkout --orphan keepalive
            git rm -rf --quiet .
          fi
          date -u +%Y-%m-%d > keepalive.txt
          git add keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive $(cat keepalive.txt)"
          git push origin keepalive

  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install .

      - name: Rebuild index
        run: python -m gds_idea_pypi --output _site/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Add .nojekyll
        run: touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
